<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-label="skill-mcp flow: the owner message, a local find call, a 411-token hint instead of the 52,488-token skill catalog, then the agent answers">
  <title>skill-mcp — one 411-token hint instead of the 52,488-token skill catalog</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0B1220"/>
      <stop offset="1" stop-color="#0F1A2C"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="1280" height="400" fill="url(#bg)"/>
  <rect x="0.5" y="0.5" width="1279" height="399" rx="20" fill="none" stroke="#26324A" stroke-width="1"/>

  <!-- header -->
  <text x="56" y="58" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700" fill="#E6EDF7" letter-spacing="-0.5">skill-mcp</text>
  <rect x="252" y="36" width="280" height="28" rx="14" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <text x="392" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7" text-anchor="middle">local MCP server + opencode plugin</text>
  <text x="1224" y="54" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7" text-anchor="end">Node &#8805; 20 &#183; MIT &#183; read-only</text>

  <!-- promise (approved headline, verbatim) -->
  <text x="56" y="108" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#E6EDF7" letter-spacing="-0.3">Your agent has hundreds of skills and ignores them &#8212;</text>
  <text x="56" y="138" font-family="Arial, Helvetica, sans-serif" font-size="25" font-weight="700" fill="#E6EDF7" letter-spacing="-0.3">this hands it the right one, the rest stay out of context</text>
  <text x="56" y="168" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#9FB0C7">411-token hint instead of a 52,488-token skill catalog &#183; 99% less context</text>

  <!-- flow: step labels -->
  <text x="78" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">1 &#183; OWNER MESSAGE</text>
  <text x="370" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">2 &#183; FIND</text>
  <text x="478" y="194" font-family="Arial, Helvetica, sans-serif" font-size="9.5" font-weight="700" fill="#FBBF24" letter-spacing="1.2">GATE</text>
  <g stroke="#FBBF24" stroke-width="1.6" fill="none">
    <path d="M464 190 v-3.2 a4 4 0 0 1 8 0 v3.2"/>
    <rect x="461.5" y="190" width="13" height="9.5" rx="2" fill="#2A2210"/>
  </g>
  <text x="662" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">3 &#183; CONTEXT</text>
  <text x="954" y="196" font-family="Arial, Helvetica, sans-serif" font-size="10.5" font-weight="700" fill="#60A5FA" letter-spacing="1.2">4 &#183; ANSWER</text>

  <!-- cards -->
  <rect x="76" y="206" width="252" height="118" rx="12" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <rect x="368" y="206" width="252" height="118" rx="12" fill="#141E31" stroke="#FBBF24" stroke-width="1" stroke-dasharray="5 4"/>
  <rect x="660" y="206" width="252" height="118" rx="12" fill="#141E31" stroke="#27344C" stroke-width="1"/>
  <rect x="952" y="206" width="252" height="118" rx="12" fill="#141E31" stroke="#27344C" stroke-width="1"/>

  <!-- card 1: owner message -->
  <text x="94" y="238" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#E6EDF7">&#8220;review a supply</text>
  <text x="94" y="258" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#E6EDF7">contract&#8221;</text>
  <text x="94" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">one message =</text>
  <text x="94" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">one gate signature</text>

  <!-- card 2: find -->
  <text x="386" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">BM25 over name,</text>
  <text x="386" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">description, headings</text>
  <text x="386" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">RU &#8594; EN dictionary</text>
  <rect x="386" y="282" width="146" height="24" rx="12" fill="#17243A"/>
  <text x="459" y="299" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">local &#183; no network</text>

  <!-- card 3: context -->
  <text x="678" y="234" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">hint: 1,380 chars</text>
  <text x="678" y="252" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">= 411 tokens</text>
  <text x="678" y="270" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">preload: likely SKILL.md,</text>
  <rect x="678" y="282" width="146" height="24" rx="12" fill="#17243A"/>
  <text x="751" y="299" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="700" fill="#60A5FA" text-anchor="middle">forms in 4.9 ms</text>

  <!-- card 4: answer -->
  <text x="970" y="238" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">the agent opens the</text>
  <text x="970" y="256" font-family="Arial, Helvetica, sans-serif" font-size="12.5" fill="#E6EDF7">skill and answers</text>
  <text x="970" y="290" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">no match &#8212; answers</text>
  <text x="970" y="305" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#9FB0C7">as usual</text>

  <!-- arrows -->
  <g stroke="#60A5FA" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M334 265 H350"/>
    <path d="M344 258 L352 265 L344 272"/>
    <path d="M626 265 H642"/>
    <path d="M636 258 L644 265 L636 272"/>
    <path d="M918 265 H934"/>
    <path d="M928 258 L936 265 L928 272"/>
  </g>

  <!-- gate note -->
  <text x="370" y="344" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FBBF24">gate &#183; other tool calls</text>
  <text x="370" y="359" font-family="Arial, Helvetica, sans-serif" font-size="11.5" fill="#FBBF24">refused until find runs</text>

  <!-- footer -->
  <text x="56" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7">Local only &#8212; no network, no LLM, no keys. Search is lexical.</text>
  <text x="1224" y="386" font-family="Arial, Helvetica, sans-serif" font-size="12" fill="#9FB0C7" text-anchor="end">416 SKILL.md indexed &#183; hint forms in 4.9 ms &#183; 2026-11-13</text>
</svg>
